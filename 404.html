<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>页面不存在 · Chronicle Forge</title>
    <link rel="icon" type="image/svg+xml" href="assets/app-icon.svg" />
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px;
        background: #f3f3f1;
        color: #1d1f24;
        font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
      }
      .card {
        max-width: 520px;
        width: 100%;
        text-align: center;
      }
      .mark {
        width: 72px;
        height: 72px;
        margin: 0 auto 28px;
        border-radius: 22px;
        background: linear-gradient(135deg, #8b47b7, #ff3da5);
        display: grid;
        place-items: center;
        box-shadow: 0 18px 40px rgba(139, 71, 183, .28);
      }
      .mark svg { width: 40px; height: 40px; }
      .code {
        font-size: 13px;
        letter-spacing: .22em;
        color: #8b47b7;
        margin: 0 0 12px;
        font-weight: 600;
      }
      h1 { font-size: 26px; margin: 0 0 14px; font-weight: 650; }
      p { font-size: 15px; line-height: 1.75; color: #52565f; margin: 0 0 30px; }
      a.button {
        display: inline-block;
        padding: 12px 26px;
        border-radius: 999px;
        background: #1d1f24;
        color: #fbfbfe;
        text-decoration: none;
        font-size: 15px;
        transition: transform .2s ease, box-shadow .2s ease;
      }
      a.button:hover { transform: translateY(-1px); box-shadow: 0 10px 24px rgba(29, 31, 36, .22); }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
          <path d="M128 160h256M128 256h256M128 352h256" stroke="#ffdbf2" stroke-width="22" stroke-linecap="round" opacity=".82" fill="none" />
          <path d="M184 118v276M328 118v276" stroke="#fbfbfe" stroke-width="18" stroke-linecap="round" fill="none" />
          <circle cx="184" cy="160" r="29" fill="#040316" stroke="#fbfbfe" stroke-width="13" />
          <circle cx="328" cy="256" r="29" fill="#040316" stroke="#fbfbfe" stroke-width="13" />
          <circle cx="184" cy="352" r="29" fill="#040316" stroke="#fbfbfe" stroke-width="13" />
        </svg>
      </div>
      <p class="code">404</p>
      <h1>这条时间线上没有对应节点</h1>
      <p>你要访问的页面不存在，或者已经被移动到其他分支。回到编辑器继续整理你的世界线吧。</p>
      <a class="button" href="./index.html">返回 Chronicle Forge</a>
    </main>
  </body>
</html>

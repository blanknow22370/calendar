name: Deploy web version to GitHub Pages

# 仓库根目录约定为 source/。推送后自动生成网页版并发布到 GitHub Pages。
# 前置条件：仓库 Settings → Pages → Source 选择 "GitHub Actions"。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # build-web.cjs 只用 node 内置模块，无需 npm install
      - name: 生成网页版
        run: node scripts/build-web.cjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: release/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
